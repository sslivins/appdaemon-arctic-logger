arctic_logger:
  module: arctic_logger
  class: ArcticLogger
  log: arctic_logger_log

  # --- Sniffer to poll ---------------------------------------------------
  # The arctic-sniffer's HTTP API. Give either `host` (an IP/hostname; the
  # base URL becomes http://<host>) or a full `base_url`.
  host: 192.168.10.118
  # base_url: http://192.168.10.118

  # How often to poll and store a row (seconds).
  poll_interval_seconds: 30
  # Per-request HTTP timeout when talking to the sniffer.
  http_timeout_seconds: 8

  # --- COP estimation ----------------------------------------------------
  # The unit exposes no water flow (only a flow *switch*) and the loop
  # circulator isn't on this bus, so thermal output and COP are estimated
  # from a constant loop flow x condenser dT (outlet - inlet). 11 GPM is the
  # Arctic 040A (48k BTU) manufacturer design flow; replace with a one-time
  # clamp-on measurement to sharpen it. Raw temps + input power are stored
  # every row, so historical COP can always be recomputed with a new value.
  loop_flow_gpm: 11.0
  # Loop fluid heat properties (used with loop_flow_gpm to get thermal output).
  # Defaults are pure water (cp 4186 J/kg.K, density 1.0 kg/L). This loop runs
  # ~25% propylene glycol, which lowers cp but slightly raises density:
  fluid_cp_j_kgk: 3950
  fluid_density_kg_l: 1.015
  # Ignore COP unless the compressor is actually drawing this many watts.
  cop_min_input_w: 200

  # --- Storage -----------------------------------------------------------
  # SQLite database file. Defaults to arctic_log.db inside this app directory
  # (gitignored). Point it at a larger/backed-up volume if you prefer.
  # db_file: /conf/apps/arctic_logger/arctic_log.db

  # --- Home Assistant sensors (optional) ---------------------------------
  # Publish a curated subset of decoded values as sensor.<prefix>_* /
  # binary_sensor.<prefix>_* so they can be graphed in HA. The SQLite log is
  # written regardless. Off by default to avoid cluttering HA.
  publish_sensors: false
  sensor_prefix: arctic
