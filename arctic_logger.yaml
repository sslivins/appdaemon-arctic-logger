arctic_logger:
  module: arctic_logger
  class: ArcticLogger
  log: arctic_logger_log

  # --- Sniffer to poll ---------------------------------------------------
  # The arctic-sniffer's HTTP API. Give either `host` (an IP/hostname; the
  # base URL becomes http://<host>) or a full `base_url`.
  host: 192.168.10.118
  # base_url: http://192.168.10.118

  # How often to poll and store a row (seconds).
  poll_interval_seconds: 30
  # Per-request HTTP timeout when talking to the sniffer.
  http_timeout_seconds: 8

  # --- Heat-pump identity (multi-unit installs) --------------------------
  # Each heat pump has its own sniffer and its own logger instance. Run one
  # copy of this app per unit (arctic_logger_hp1, arctic_logger_hp2, ...),
  # each with its own host, db_file, hp_id, and hp_name. hp_id namespaces the
  # MQTT topics/entities (arctic_<hp_id>_*); hp_name is the HA device name.
  hp_id: hp1
  hp_name: Arctic HP1 (Sniffer)

  # --- COP estimation ----------------------------------------------------
  # The unit exposes no water flow (only a flow *switch*) and the loop
  # circulator isn't on this bus, so thermal output and COP are estimated
  # from a constant loop flow x condenser dT (outlet - inlet). 11 GPM is the
  # Arctic 040A (48k BTU) manufacturer design flow; replace with a one-time
  # clamp-on measurement to sharpen it. Raw temps + input power are stored
  # every row, so historical COP can always be recomputed with a new value.
  loop_flow_gpm: 11.0
  # Loop fluid. Simplest: give the propylene-glycol concentration (vol %) and
  # cp/density are derived at ~40 C operating temp. This loop is ~25% PG.
  glycol_pct: 25
  # Advanced override (skips the glycol_pct math) -- set both explicitly, e.g.
  # for ethylene glycol or a lab-measured value:
  # fluid_cp_j_kgk: 3950
  # fluid_density_kg_l: 1.015
  # Ignore COP unless the compressor is actually drawing this many watts.
  cop_min_input_w: 200

  # --- Storage -----------------------------------------------------------
  # SQLite database file. Defaults to arctic_log.db inside this app directory
  # (gitignored). Point it at a larger/backed-up volume if you prefer.
  # db_file: /conf/apps/arctic_logger/arctic_log.db

  # --- Home Assistant sensors (optional) ---------------------------------
  # Publish a curated subset of decoded values as sensor.<prefix>_* /
  # binary_sensor.<prefix>_* so they can be graphed in HA. The SQLite log is
  # written regardless. Off by default to avoid cluttering HA.
  #
  # NOTE: this legacy path uses AppDaemon set_state, which creates ephemeral
  # entities with NO long-term statistics. Prefer MQTT discovery below.
  publish_sensors: false
  sensor_prefix: arctic

  # --- Home Assistant via MQTT discovery (recommended) -------------------
  # Publishes proper HA entities (device_class/state_class/units) under a
  # per-HP device via MQTT auto-discovery. These get long-term statistics
  # (the power sensor's hourly mean feeds a 48h/1h energy view) and survive
  # restarts. Requires paho-mqtt in the AppDaemon container and an MQTT broker
  # (e.g. the HA Mosquitto add-on). Entities appear as sensor.arctic_<hp_id>_*.
  mqtt_enabled: true
  mqtt_host: 192.168.10.212
  mqtt_port: 1883
  mqtt_username: arctic_sniffer
  # Store the password in AppDaemon's secrets file (/conf/secrets.yaml) as
  # `arctic_mqtt_password: <pw>` and reference it here — never commit it.
  mqtt_password: !secret arctic_mqtt_password
  # HA discovery topic prefix (matches the HA MQTT integration setting).
  mqtt_discovery_prefix: homeassistant

